<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Monaco IDE — Render V2 · Tab 2 Spec Studio</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">‹›</span> Monaco IDE <span class="crumb">/ json-renderers-from-instructions / Tab 2 · Spec Studio</span>
    </div>
    <div class="topbar-actions">
      <div class="select-group">
        <span class="select-label">Main</span>
        <select id="mainTypeSelect" class="spec-select"></select>
      </div>

      <div class="select-group">
        <span class="select-label">Sub</span>
        <select id="subTypeSelect" class="spec-select"></select>
      </div>

      <button id="buildButton" class="btn-build-live" type="button" title="Build and render to Tab 3">
        <i class="bi bi-play-fill fs-6"></i>
        <span>Build & Render</span>
      </button>

      <a href="../data/" class="topbar-link" title="Open Data Studio">← Tab 1: Data Studio</a>
      <a href="../display/" class="topbar-link" title="Open Live Render Page">Tab 3: Live Render →</a>
      <a href="../../../" class="topbar-link" title="Back to Docs Portal">Docs</a>
    </div>
  </header>

  <main class="workspace">
    <!-- Single Editor: Spec / Instructions JSON -->
    <section id="paneSpec" class="pane">
      <div class="pane-heading">
        <div>
          <span class="eyebrow">INSTRUCTION CONTRACT (SPEC REPO)</span>
          <h1 id="editorTitleSpec">Base Spec AST</h1>
        </div>
        <div class="pane-actions">
          <span class="file-label" style="gap:4px;">
            <i class="bi bi-box-arrow-in-down text-info"></i>
            <span>spec-repo</span>
          </span>
        </div>
      </div>
      <div id="monacoSpec" class="editor"></div>
      <footer>
        <span id="footerInfoSpec"><i class="bi bi-file-code text-info me-1"></i> Spec: table.simple</span>
        <span>JSON</span>
      </footer>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script type="module" src="https://keshavsoft.github.io/dom-primitive-bindings/dist/v8/min.js"></script>
  <script type="module" src="https://keshavsoft.github.io/dom-primitive-engine/dist/v19/min.js"></script>
  <script type="module" src="https://keshavsoft.github.io/spec-repo/dist/v6/min.js"></script>

  <script type="module" src="./js/index.js"></script>
</body>

</html>
