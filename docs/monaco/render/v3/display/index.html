<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Render — Tab 3 Consumer (V3)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f8fafc;
      color: #334155;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .top-strip {
      background: #0f172a;
      color: #94a3b8;
      border-bottom: 1px solid #1e293b;
      padding: 10px 20px;
    }
    .top-strip a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
    }
    .top-strip a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <!-- Top Navigation & Status Strip -->
  <header class="top-strip d-flex align-items-center justify-content-between flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
      <span class="badge bg-primary px-2 py-1">Tab 3</span>
      <span class="text-white fw-bold small">Live Plain HTML Consumer</span>
      <span class="text-secondary small">/ json-renderers-from-instructions</span>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span id="renderStatus" class="badge bg-secondary-subtle text-secondary px-3 py-1">Connecting to bridge...</span>
      <a href="../data/">← Tab 1: Data Studio</a>
      <a href="../spec/">← Tab 2: Spec Studio</a>
      <a href="../../../" class="text-light">Docs Portal</a>
    </div>
  </header>

  <!-- PURE HTML DOM CONTAINER -->
  <main class="container-fluid px-4 py-3">
    <div id="dom-render-container">
      <div class="text-center py-5 text-muted">
        <div class="spinner-border text-primary spinner-border-sm mb-2" role="status"></div>
        <div>Initializing live render engine...</div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../../../dist/v7/min.js"></script>
  <script type="module" src="./index.js"></script>
</body>

</html>
