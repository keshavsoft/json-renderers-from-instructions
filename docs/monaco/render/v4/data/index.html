<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Monaco IDE — Render V2 · Tab 1 Data Studio</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
</head>

<body id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">‹›</span> Monaco IDE <span class="crumb">/ json-renderers-from-instructions / Tab 1 · Data Studio</span>
    </div>
    <div class="topbar-actions">
      <button id="syncDataBtn" class="btn-sync" type="button" style="background:#16a34a;color:#fff;border:none;border-radius:4px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;" title="Sync live Data and Columns">Sync Data</button>
      <a href="../spec/" class="topbar-link" title="Open Spec Studio">Tab 2: Spec Studio →</a>
      <a href="../display/" class="topbar-link" title="Open Live Render Page">Tab 3: Live Render →</a>
      <a href="../../../" class="topbar-link" title="Back to Docs Portal">Docs</a>
    </div>
  </header>

  <main class="workspace">
    <!-- Left Editor: Data Records JSON -->
    <section id="paneLeft" class="pane">
      <div class="pane-heading">
        <div>
          <span class="eyebrow">SOURCE DATA</span>
          <h1 id="editorTitleLeft">data.json</h1>
        </div>
        <div class="pane-actions">
          <label class="file-label">
            <span>Load JSON:</span>
            <input type="file" id="filePickerLeft" accept=".json">
          </label>
        </div>
      </div>
      <div id="monacoLeft" class="editor"></div>
      <footer>
        <span id="footerInfoLeft">File: data.json</span>
        <span>JSON</span>
      </footer>
    </section>

    <!-- Right Editor: Columns Metadata JSON -->
    <section id="paneRight" class="pane">
      <div class="pane-heading">
        <div>
          <span class="eyebrow">COLUMN METADATA</span>
          <h1 id="editorTitleRight">columns.json</h1>
        </div>
        <div class="pane-actions">
          <label class="file-label">
            <span>Load JSON:</span>
            <input type="file" id="filePickerRight" accept=".json">
          </label>
        </div>
      </div>
      <div id="monacoRight" class="editor"></div>
      <footer>
        <span id="footerInfoRight">File: columns.json</span>
        <span>JSON</span>
      </footer>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script type="module" src="https://keshavsoft.github.io/dom-primitive-bindings/dist/v8/min.js"></script>
  <script type="module" src="https://keshavsoft.github.io/dom-primitive-engine/dist/v19/min.js"></script>

  <script type="module" src="./index.js"></script>
</body>

</html>
